schema = 1

# Bentley bmake makefiles. No built-in claims .mki or .mke, so no sniff: a
# sniffed manifest drops every file that scores below min_score.
[language]
name = "bmake"
suffixes = [".mki", ".mke"]
hook_suffixes = [".mki", ".mke"]
priority = 10

# graphify_lang.bmake.extract:extract_bmake (a line scanner), resolver in resolve.py.
[extract]
runtime = "graphify_lang.bmake.extract"

# Node fields the resolver reads on other files' nodes; an incremental
# build keeps them on the context nodes of unchanged files (H1).
[resolve]
context_fields = ["node_kind", "bmake_includes"]
