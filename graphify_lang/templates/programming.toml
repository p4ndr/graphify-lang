# graphify_lang.toml template - programming language
#
# This is a template for programming language manifests (e.g., AutoLISP, C, Python).
# Copy and customize for your language.
#
# See docs/research/01-manifest-schema.md for full field documentation.

schema = "v1"

[language]
# Name of the language (used for logging and debugging)
name = "language-name"

# File suffixes this language handles (e.g., ".lsp", ".c", ".py")
# Multiple suffixes can be declared
suffixes = [".ext"]

# Optional: override a built-in suffix (e.g., ".lsp" if upstream has a default)
# built-in suffixes are taken only when listed in overrides
# overrides = [".lsp"]

# Optional: hook suffixes for watch mode (defaults to suffixes if omitted)
# hook_suffixes = [".ext"]

# Priority for precedence when multiple plugins claim the same suffix
# Higher number wins; default is 0
priority = 0

# Case-insensitive file matching (for Windows compatibility)
case_insensitive = true

# Optional: hook source suffixes (for file watching)
# hook_source_suffixes = [".ext"]

[grammar]
# Tree-sitter grammar module name
# The importable module (e.g., tree_sitter_c); only loaded when [extract] queries is set
module = "tree_sitter_language"

# Language function name in the module (usually "language")
language_fn = "language"

# Optional: extra language identifier for ambiguous grammars
# extra = "c"

# Optional: version check - fails if installed grammar version doesn't match
# version = "0.4.1"

[extract]
# Runtime module that implements build()
# The module must have a build(manifest_path, manifest) -> (extract_fn, resolver_fn) function
runtime = "graphify_lang.rules"

# Optional: builtins file (one name per line, # comments)
# builtins_file = "data/builtins.txt"

# Optional: builtin prefixes for fuzzy matching
# builtins_prefixes = ["vla-", "vlax-"]

# Optional: query tier - tags.scm file(s), relative to this manifest.
# Captures: @definition.<node_kind> (span), @name (label),
# @reference.<relation> (a use, labelled by @name). Needs [grammar] module.
# A missing grammar or a query that does not compile is an error on every
# file, never a silent empty result.
# queries = ["tags.scm"]

# Optional: one regex whose matches are blanked before the regex tier runs.
# comments = '/\*.*?\*/|//[^\n]*'

# Optional: Python hook, called after the rules run:
# fn(path, tree, nodes, edges, manifest) -> None or {"nodes": ..., "edges": ...}
# post_file = "module:fn"

# Regex tier - one [[rule]] per pattern; see graphify_lang/regex_rules.py.
# node = "<kind>" emits a definition; edge = "<relation>" emits a reference
# resolved to a definition in the same file (builtins are dropped first).
# scope: push | set | pop | ref (default); edges start at the current scope.
[[rule]]
pattern = "^\\s*def\\s+(?P<name>[A-Za-z_][A-Za-z0-9_]*)\\s*\\("
node = "function"
scope = "set"

[[rule]]
pattern = "(?<!def\\s)\\b(?P<name>[A-Za-z_][A-Za-z0-9_]*)\\s*\\("
edge = "calls"

# Node kinds and relations are not declared in a table: the query tier takes
# them from the capture names (@definition.<node_kind>, @reference.<relation>)
# and the regex tier from each rule's `node = "<kind>"` / `edge = "<relation>"`.
