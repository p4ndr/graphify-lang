schema = 1

[language]
name = "autolisp-dcl"
type = "markup"
suffixes = [".dcl"]
priority = 5
case_insensitive = true

[grammar]
kind = "regex"
language_fn = "dcl"

[extract]
runtime = "graphify_lang.rules"

[node_kind]
dialog = "dialog"
control = "control"

[edge_kind]
contains = "contains"
references = "references"
action = "action"

[[rule]]
kind = "regex"
name = "dialog_definition"
pattern = "(?P<dialog_name>[a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*dialog\s*\{"
scope = "push"
type = "node"
