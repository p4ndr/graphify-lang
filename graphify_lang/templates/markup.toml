# graphify_lang.toml template - markup language
#
# This is a template for markup language manifests (e.g., HTML, XML, Markdown).
# Copy and customize for your language.
#
# See docs/research/01-manifest-schema.md for full field documentation.

schema = "v1"

[language]
# Name of the language
name = "markup-language"

# File suffixes this language handles
suffixes = [".html", ".xml"]

# Priority for precedence (higher wins)
priority = 0

# Case-insensitive file matching
case_insensitive = true

[grammar]
# Tree-sitter grammar module
module = "tree_sitter_markup"

# Language function name
language_fn = "language"

# Optional: extra identifier
# extra = "html"

[extract]
# Runtime module
runtime = "graphify_lang.rules"

# Optional: builtins file
# builtins_file = "data/builtins.txt"

# Optional: Python hooks
# post_file = "<your_package>.<module>:fn"  (graphify_lang.* or the package passed as
#   rules.build(..., package="<your_package>"); any other module is rejected)

[resolve]
# Node fields your resolver reads on OTHER files' nodes (default ["node_kind"]).
# On an incremental build (`graphify watch`, `graphify extract` on an existing
# graph) an unchanged file reaches the resolver only as a context node: id,
# label, source_file (root-relative), file_type, type, the fields listed here,
# and no payloads (refs) and no edges but contains / method / inherits. A
# cross-file fact the resolver needs must be one of these fields. Compare
# paths with graphify_lang._common.source_of(node), never node["source_file"].
context_fields = ["node_kind"]

# Node kinds and relations are not declared in a table: the query tier takes
# them from the capture names (@definition.<node_kind>, @reference.<relation>)
# and the regex tier from each rule's `node = "<kind>"` / `edge = "<relation>"`.
