schema = 1

[language]
name = "autolisp"
type = "programming"
suffixes = [".lsp", ".mnl"]
overrides = [".lsp"]
hook_suffixes = [".lsp", ".mnl", ".dcl"]
priority = 10
case_insensitive = true

[grammar]
kind = "tree-sitter"
module = "tree_sitter_commonlisp"
language_fn = "language()"
extra = "commonlisp"
version = "0.4.1"

# The extractor is a purpose-built walker (plan 02 §3), not query rules:
# graphify_lang.autolisp.extract:extract_autolisp, resolver in resolve.py.
[extract]
runtime = "graphify_lang.autolisp.extract"
builtins_file = "data/builtins.txt"
builtins_prefixes = ["vla-", "vlax-", "vlr-"]
