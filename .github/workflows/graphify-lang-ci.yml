name: graphify-lang CI

on:
  push:
    branches: ["autolisp", "lang-*", "rr-*", "v8"]
    # fork tags only: a bare v* also matched every upstream release tag (S2-N2)
    tags: ['v*\+lang.*']
  pull_request:
    branches: ["autolisp", "lang-*", "rr-*", "v8"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen installs straight from the committed uv.lock without re-resolving
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run --frozen pytest tests/ -q --tb=short -m 'not perf'

      - name: Verify install works end-to-end
        run: |
          uv run --frozen graphify --help
          uv run --frozen graphify install

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Gate: the fork layer only (0 issues at any severity). Upstream code keeps
      # 4 High B324 and would turn a gate red on every run (cc-CR000.003 S2-M2).
      - name: bandit (fork layer, gating)
        run: uv run --frozen bandit -r graphify_lang -ll

      - name: bandit (upstream and fork, informational)
        continue-on-error: true
        run: uv run --frozen bandit -r graphify graphify_lang -ll

      # --skip-editable: the project itself (graphifyy +lang.N) is not on PyPI;
      # with --strict that skip was fatal, so the audit never ran (cc-CR000.003 S2-M1)
      - name: pip-audit (dependency vulnerabilities)
        run: uv run --frozen pip-audit --skip-editable

  # A release tag builds the wheel and loads every plugin from a clean install,
  # so missing package data fails here and not after release (cc-CR000.003 S2-E1).
  # workflow_dispatch runs it by hand on a branch.
  wheel:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

      - name: Install it into a clean venv and load every plugin
        working-directory: ${{ runner.temp }}
        run: |
          uv venv clean
          uv pip install --python clean/bin/python dist/*.whl
          clean/bin/graphify lang list --check
